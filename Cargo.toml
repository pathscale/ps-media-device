[package]
name = "ps-media-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "macOS CoreAudio device discovery and PCM streaming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/ps-media-device"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { version = "0.3", default-features = false, features = [
    "std",
    "AudioQueue",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AudioHardware",
    "objc2",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
] }
